[package]
name = "pqbench"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
pqcrypto-dilithium = "0.5"
pqcrypto-falcon = "0.4.1"
pqcrypto-sphincsplus = "0.7.2"
pqcrypto-traits = "0.3.5"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
